<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Details - CNS Management System</title>
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-airplane"></i> CNS Management System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link" id="userDisplay">
                            <i class="bi bi-person-circle"></i> 
                            <span id="userName">Loading...</span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout(); return false;">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-2 d-none d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-grid-1x2-fill"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="systems.html">
                                <i class="bi bi-server"></i> Systems
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tasks.html">
                                <i class="bi bi-list-task"></i> Tasks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="calendar.html">
                                <i class="bi bi-calendar-event"></i> Calendar
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="incidents.html">
                                <i class="bi bi-exclamation-triangle"></i> Incidents
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="spare-parts.html">
                                <i class="bi bi-box-seam"></i> Spare Parts
                            </a>
                        </li>
                        <li class="nav-item" id="adminMenu" style="display:none;">
                            <hr class="border-secondary">
                            <li class="nav-item">
                                <a class="nav-link" href="users.html">
                                    <i class="bi bi-people"></i> Users
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="groups.html">
                                    <i class="bi bi-people-fill"></i> Groups
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="settings.html">
                                    <i class="bi bi-gear"></i> Settings
                                </a>
                            </li>
                        </li>
                        <hr class="border-secondary">
                        <li class="nav-item">
                            <a class="nav-link" href="profile.html">
                                <i class="bi bi-person-circle"></i> Profile
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2" id="systemTitle">System Details</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="systems.html" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Systems
                        </a>
                    </div>
                </div>

                <div id="systemDetailsContent">
                    <!-- System details will be loaded here -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../node_modules/axios/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/systems.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth();
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
                if (isAdmin() || isManager()) {
                    document.getElementById('adminMenu').style.display = 'block';
                }
                
                // Get system ID from URL parameter
                const urlParams = new URLSearchParams(window.location.search);
                const systemId = urlParams.get('id');
                
                if (systemId) {
                    loadSystemDetails(systemId);
                } else {
                    document.getElementById('systemDetailsContent').innerHTML = `
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle"></i> No system selected.
                            <a href="systems.html" class="alert-link">Go back to systems</a>
                        </div>
                    `;
                }
            }
        });

        async function loadSystemDetails(systemId) {
            const container = document.getElementById('systemDetailsContent');
            try {
                const system = await API.get(`/systems/${systemId}`);
                
                document.getElementById('systemTitle').textContent = system.name;
                
                // Use the viewSystem function from systems.js
                showSystemDetailsModal(system);
                
                // Since we're showing in a modal, we'll also display in the page
                container.innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <h6>Basic Information</h6>
                                    <p><strong>Type:</strong> ${system.systemType}</p>
                                    <p><strong>Subsystem:</strong> ${system.subsystem}</p>
                                    <p><strong>Manufacturer:</strong> ${system.manufacturer}</p>
                                    <p><strong>Model:</strong> ${system.model}</p>
                                    <p><strong>Serial Number:</strong> ${system.serialNumber || 'N/A'}</p>
                                    <p><strong>Status:</strong> <span class="status-indicator status-${system.status}"></span> ${system.status}</p>
                                </div>
                                <div class="col-md-6">
                                    <h6>Location & Installation</h6>
                                    <p><strong>Site:</strong> ${system.location?.site || 'N/A'}</p>
                                    <p><strong>Building:</strong> ${system.location?.building || 'N/A'}</p>
                                    <p><strong>Room:</strong> ${system.location?.room || 'N/A'}</p>
                                    <p><strong>Installation Date:</strong> ${system.installationDate ? new Date(system.installationDate).toLocaleDateString() : 'N/A'}</p>
                                    <p><strong>Service Level:</strong> ${system.serviceLevel}</p>
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-12">
                                    <h6>Configuration</h6>
                                    <div class="system-config-grid">
                                        ${system.configuration ? Object.entries(system.configuration).map(([key, value]) => `
                                            <div class="system-config-item">
                                                <strong>${key}</strong><br>
                                                <small>${value}</small>
                                            </div>
                                        `).join('') : '<p>No configuration data</p>'}
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-12">
                                    <h6>Spare Parts</h6>
                                    ${system.spareParts && system.spareParts.length > 0 ?
                                        `<ul class="list-group">
                                            ${system.spareParts.map(spare => `
                                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                                    ${spare.part?.name || 'Unknown'}
                                                    <span class="badge bg-primary">Qty: ${spare.quantity}</span>
                                                </li>
                                            `).join('')}
                                        </ul>` :
                                        '<p>No spare parts associated</p>'
                                    }
                                </div>
                            </div>
                            <div class="mt-3">
                                <a href="systems.html" class="btn btn-secondary">Back to Systems</a>
                                ${isManager() ? `
                                    <button class="btn btn-primary" onclick="editSystem('${system._id}')">
                                        <i class="bi bi-pencil"></i> Edit
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        Failed to load system details: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
