<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Details - CNS Management System</title>
    <link href="../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-airplane"></i> CNS Management System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link" id="userDisplay">
                            <i class="bi bi-person-circle"></i> 
                            <span id="userName">Loading...</span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout(); return false;">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-2 d-none d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard.html">
                                <i class="bi bi-grid-1x2-fill"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="systems.html">
                                <i class="bi bi-server"></i> Systems
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tasks.html">
                                <i class="bi bi-list-task"></i> Tasks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="calendar.html">
                                <i class="bi bi-calendar-event"></i> Calendar
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="incidents.html">
                                <i class="bi bi-exclamation-triangle"></i> Incidents
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="spare-parts.html">
                                <i class="bi bi-box-seam"></i> Spare Parts
                            </a>
                        </li>
                        <li class="nav-item" id="adminMenu" style="display:none;">
                            <hr class="border-secondary">
                            <li class="nav-item">
                                <a class="nav-link" href="users.html">
                                    <i class="bi bi-people"></i> Users
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="groups.html">
                                    <i class="bi bi-people-fill"></i> Groups
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="settings.html">
                                    <i class="bi bi-gear"></i> Settings
                                </a>
                            </li>
                        </li>
                        <hr class="border-secondary">
                        <li class="nav-item">
                            <a class="nav-link" href="profile.html">
                                <i class="bi bi-person-circle"></i> Profile
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2" id="incidentTitle">Incident Details</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="incidents.html" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Incidents
                        </a>
                    </div>
                </div>

                <div id="incidentDetailsContent">
                    <!-- Incident details will be loaded here -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../node_modules/axios/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/incidents.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuth();
            const user = getCurrentUser();
            if (user) {
                document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
                if (isAdmin() || isManager()) {
                    document.getElementById('adminMenu').style.display = 'block';
                }
                
                // Get incident ID from URL parameter
                const urlParams = new URLSearchParams(window.location.search);
                const incidentId = urlParams.get('id');
                
                if (incidentId) {
                    loadIncidentDetails(incidentId);
                } else {
                    document.getElementById('incidentDetailsContent').innerHTML = `
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle"></i> No incident selected.
                            <a href="incidents.html" class="alert-link">Go back to incidents</a>
                        </div>
                    `;
                }
            }
        });

        async function loadIncidentDetails(incidentId) {
            const container = document.getElementById('incidentDetailsContent');
            try {
                const incident = await API.get(`/incidents/${incidentId}`);
                
                document.getElementById('incidentTitle').textContent = `${incident.incidentNumber} - ${incident.title}`;
                
                container.innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <h6>Incident Information</h6>
                                    <p><strong>Type:</strong> ${incident.incidentType}</p>
                                    <p><strong>Severity:</strong> <span class="badge bg-${getSeverityColor(incident.severity)}">${incident.severity}</span></p>
                                    <p><strong>Status:</strong> <span class="badge bg-${getIncidentStatusColor(incident.status)}">${incident.status}</span></p>
                                    <p><strong>System:</strong> ${incident.system?.name || 'N/A'}</p>
                                    <p><strong>Reported By:</strong> ${incident.reportedBy?.firstName || ''} ${incident.reportedBy?.lastName || ''}</p>
                                </div>
                                <div class="col-md-6">
                                    <h6>Timeline</h6>
                                    <p><strong>Reported:</strong> ${incident.reportedAt ? new Date(incident.reportedAt).toLocaleString() : 'N/A'}</p>
                                    <p><strong>Detected:</strong> ${incident.detectedAt ? new Date(incident.detectedAt).toLocaleString() : 'N/A'}</p>
                                    <p><strong>Resolved:</strong> ${incident.resolutionDate ? new Date(incident.resolutionDate).toLocaleString() : 'Not resolved'}</p>
                                    <p><strong>Downtime:</strong> ${incident.downtime ? `${incident.downtime} minutes` : 'N/A'}</p>
                                </div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-12">
                                    <h6>Description</h6>
                                    <p>${incident.description || 'No description provided'}</p>
                                </div>
                            </div>
                            ${incident.rootCause ? `
                                <hr>
                                <div class="row">
                                    <div class="col-12">
                                        <h6>Root Cause</h6>
                                        <p><strong>Category:</strong> ${incident.rootCause.category}</p>
                                        <p>${incident.rootCause.description || ''}</p>
                                        ${incident.rootCause.confirmedBy ? `<small class="text-muted">Confirmed by: ${incident.rootCause.confirmedBy.firstName} ${incident.rootCause.confirmedBy.lastName}</small>` : ''}
                                    </div>
                                </div>
                            ` : ''}
                            ${incident.solution ? `
                                <hr>
                                <div class="row">
                                    <div class="col-12">
                                        <h6>Solution</h6>
                                        <p>${incident.solution.description || ''}</p>
                                        ${incident.solution.implementedBy ? `<small class="text-muted">Implemented by: ${incident.solution.implementedBy.firstName} ${incident.solution.implementedBy.lastName}</small>` : ''}
                                    </div>
                                </div>
                            ` : ''}
                            ${incident.actionsTaken && incident.actionsTaken.length > 0 ? `
                                <hr>
                                <div class="row">
                                    <div class="col-12">
                                        <h6>Actions Taken</h6>
                                        <div class="timeline">
                                            ${incident.actionsTaken.map(action => `
                                                <div class="timeline-item">
                                                    <div class="time">${action.timestamp ? new Date(action.timestamp).toLocaleString() : 'N/A'}</div>
                                                    <div><strong>${action.action}</strong></div>
                                                    <div>${action.notes || ''}</div>
                                                    <small class="text-muted">By: ${action.performedBy?.firstName || ''} ${action.performedBy?.lastName || ''}</small>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                            ${incident.sparesUsed && incident.sparesUsed.length > 0 ? `
                                <hr>
                                <div class="row">
                                    <div class="col-12">
                                        <h6>Spares Used</h6>
                                        <ul class="list-group">
                                            ${incident.sparesUsed.map(spare => `
                                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                                    ${spare.part?.name || 'Unknown'} (${spare.part?.partNumber || ''})
                                                    <span class="badge bg-primary">Qty: ${spare.quantity}</span>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                </div>
                            ` : ''}
                            ${incident.lessonsLearned ? `
                                <hr>
                                <div class="row">
                                    <div class="col-12">
                                        <h6>Lessons Learned</h6>
                                        <p>${incident.lessonsLearned}</p>
                                    </div>
                                </div>
                            ` : ''}
                            ${incident.preventiveActions ? `
                                <hr>
                                <div class="row">
                                    <div class="col-12">
                                        <h6>Preventive Actions</h6>
                                        <p>${incident.preventiveActions}</p>
                                    </div>
                                </div>
                            ` : ''}
                            <div class="mt-3">
                                <a href="incidents.html" class="btn btn-secondary">Back to Incidents</a>
                                ${isManager() ? `
                                    <button class="btn btn-primary" onclick="editIncident('${incident._id}')">
                                        <i class="bi bi-pencil"></i> Edit
                                    </button>
                                    ${incident.status !== 'resolved' ? `
                                        <button class="btn btn-success" onclick="resolveIncident('${incident._id}')">
                                            <i class="bi bi-check-circle"></i> Resolve
                                        </button>
                                    ` : ''}
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        Failed to load incident details: ${error.message}
                    </div>
                `;
            }
        }

        // Helper function for severity color
        function getSeverityColor(severity) {
            const colors = {
                critical: 'danger',
                high: 'warning',
                medium: 'info',
                low: 'success'
            };
            return colors[severity] || 'secondary';
        }

        // Helper function for incident status color
        function getIncidentStatusColor(status) {
            const colors = {
                reported: 'danger',
                investigating: 'warning',
                in_progress: 'primary',
                resolved: 'success',
                closed: 'secondary',
                escalated: 'danger'
            };
            return colors[status] || 'secondary';
        }

        // Resolve incident
        async function resolveIncident(id) {
            if (!confirm('Are you sure you want to resolve this incident?')) return;
            
            try {
                // Show a modal to collect resolution details
                const solution = prompt('Enter solution description:');
                if (solution === null) return;
                
                await API.patch(`/incidents/${id}/resolve`, {
                    solution: solution,
                    status: 'resolved'
                });
                
                showToast('Incident resolved successfully', 'success');
                loadIncidentDetails(id);
            } catch (error) {
                showToast('Error resolving incident: ' + error.message, 'danger');
            }
        }
    </script>
</body>
</html>
